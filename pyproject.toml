[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-contrails-dashboard"
version = "0.1.0"
description = "Regional and FIR aviation contrail climate impact extraction pipeline, API server, and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Maximilian Czerny"},
]
dependencies = [
  "absl-py>=2.0.0",
  "apache-beam>=2.71.0",
  "fastapi>=0.100.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyarrow>=16.0.0",
  "pycountry>=22.3.5",
  "pydantic>=2.0.0",
  "pyproj>=3.5.0",
  "shapely>=2.0.0",
  "uvicorn>=0.23.0",
]

[project.urls]
Repository = "https://github.com/contrailcirrus/regional-impact-explorer"

[project.optional-dependencies]
dev = [
  "httpx>=0.24.0",
  "pyink>=23.10.0",
  "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "data_extraction*", "server*"]
namespaces = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
pythonpath = ["."]
consider_namespace_packages = true
norecursedirs = ["ui", "node_modules", "dist", "testdata", ".*"]

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
